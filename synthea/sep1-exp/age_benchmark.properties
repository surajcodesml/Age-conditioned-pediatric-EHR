# Experiment-specific Synthea config for the age-signal pediatric benchmark.
# Loaded via `run_synthea -c`. Does NOT replace synthea_peds.properties.
# exporter.baseDirectory is overridden on the CLI per age stratum.

exporter.baseDirectory = /home/suraj/Git/Age-conditioned-pediatric-EHR/synthea/sep1-exp/output/_unspecified/
exporter.csv.export = true
exporter.csv.folder_per_run = false
exporter.csv.append_mode = false
exporter.csv.included_files = patients,encounters,conditions,medications,procedures,observations,immunizations

# Keep the FULL longitudinal record (default 10 would drop early childhood for adolescents).
exporter.years_of_history = 0

exporter.fhir.transaction_bundle = false
exporter.fhir.export = false
exporter.fhir_stu3.export = false
exporter.fhir_dstu2.export = false
exporter.hospital.fhir.export = false
exporter.practitioner.fhir.export = false
exporter.groups.fhir.export = false
exporter.text.export = false
exporter.cpcds.export = false
exporter.cdw.export = false
exporter.metadata.export = true

# Living patients only so every index date equals the fixed reference date.
generate.only_alive_patients = true
generate.only_dead_patients = false
