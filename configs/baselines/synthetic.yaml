# Synthetic benchmark baseline configuration (S0–S3 + S5)
stage: synthetic
scenarios:
  - S0
  - S1
  - S2
  - S3
  - S5

data_seed: 20260922
seed: 0
device: cuda
max_epochs: 40
patience: 5
batch_size: 32
smoke_batch_size: 8
smoke_max_epochs: 2
output_dir: results/baselines/synthetic

models:
  motor:
    d_model: 256
    n_layers: 6
    n_heads: 8
    dropout: 0.1
    max_seq_len: 528
  tale_ehr:
    d_model: 256
    n_layers: 4
    n_heads: 4
    dropout: 0.1
    max_seq_len: 528
  nest:
    d_model: 256
    n_layers: 4
    n_heads: 4
    dropout: 0.1
    max_encounters: 32
    max_codes_per_encounter: 32
    max_seq_len: 528
  retain:
    d_emb: 128
    d_rnn: 128
    dropout: 0.1
  ehr_bert:
    d_model: 256
    n_layers: 4
    n_heads: 4
    d_ff: 1024
    dropout: 0.1
    max_seq_len: 528
  behrt:
    d_model: 288
    n_layers: 6
    n_heads: 12
    dropout: 0.1
    max_seq_len: 528
  medbert:
    d_model: 192
    n_layers: 6
    n_heads: 6
    dropout: 0.1
    max_seq_len: 528
  cehrbert:
    d_model: 128
    n_layers: 5
    n_heads: 8
    dropout: 0.1
    max_seq_len: 528
  dtr:
    d_model: 64
    arms:
      - temporal_only
      - age_temporal
