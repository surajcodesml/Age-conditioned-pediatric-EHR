# Shared controls for the synthetic architecture ladder.
# Fixed before any ladder run. Do not retune from intermediate results.
dataset: synthea_controlled
cohort: controlled
data_seed: 20260922
scenarios: [S0, S1, S2, S3]
# Existing multi-seed protocol on this benchmark (cehrbert_small). Not chosen from ladder results.
seeds: [0, 1, 2, 3, 4]
split_fractions:
  train: 0.70
  val: 0.15
  test: 0.15
# Matches the Content-Persistence DTR adapter that produced dtr_*_new, not the Transformer width.
d_model: 64
dropout: 0.0
lambda_init: 0.1
batch_size: 32
lr: 0.0003
weight_decay: 0.01
max_epochs: 25
patience: 5
min_epochs: 12
grad_clip: 1.0
# E04 / E05 / E06 predefined sizes.
n_channels: 4
n_components: 3
knots: [0.0, 6.0, 12.0, 18.0]
# E02 only.
stage_b_epochs: 5
temporal_lr_mult: 10.0
temporal_weight_decay: 0.0
mass_eps: 1.0e-6
age_shuffle_seed: 0
staged: false
aggregation: raw_additive
architecture: direct
