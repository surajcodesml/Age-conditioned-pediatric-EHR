   <g id="text_16">
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 29.739822)">Interpretation</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 38.138181)">─────────────</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 46.606853)">Larger θ_m → larger λ → faster decay</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 55.213806)">→ lower temporal persistence.</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 63.612166)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 72.010525)">Order acute&gt;inter&gt;chronic: True</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 80.768884)">β̂ = -2.356 (true -2.5)</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 89.167244)">Gate surface RMSE = 0.056</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 97.565603)">ΔAUPRC vs global = 0.0045</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 105.963962)"/>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 114.362322)">Note: NCH/MIMIC DTR checkpoints</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 122.830994)">have no θ_m parameters; clinical</text>
    <text style="font-size: 7.5px; font-family: 'DejaVu Sans'" transform="translate(306.132075 131.437947)">persistence histograms unavailable.</text>
   </g>
